spring.application.name=SorteioFsw

spring.config.import=optional:file:.env[.properties],optional:file:SorteioFswBackEnd/.env[.properties]

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASS}
spring.jpa.hibernate.ddl-auto=update

admin.username=${ADMIN_USERNAME}
admin.password=${ADMIN_PASSWORD}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600}

cors-origin=${CORS_ORIGIN:http://localhost:5173}
auth.cookie.secure=${COOKIE_SECURE:false}
auth.cookie.same-site=${COOKIE_SAME_SITE:Strict}
