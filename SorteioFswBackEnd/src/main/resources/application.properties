spring.application.name=SorteioFsw

spring.config.import=optional:file:.env[.properties],optional:file:SorteioFswBackEnd/.env[.properties]

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASS}
spring.jpa.hibernate.ddl-auto=update

admin.username=${ADMIN_USERNAME}
admin.password=${ADMIN_PASSWORD}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600}

cors-origin=${CORS_ORIGIN:http://localhost:5173}
auth.cookie.secure=${COOKIE_SECURE:false}
auth.cookie.same-site=${COOKIE_SAME_SITE:Strict}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000

certificado.email.remetente-nome=${MAIL_FROM_NAME:CISBAF}
# Respostas vão para este endereço, não para a conta que envia. Se ele não existir, quem responder recebe um aviso de
# endereço inexistente e nada chega na caixa da CISBAF (comportamento de "não responda").
certificado.email.responder-para=${MAIL_REPLY_TO:naoresponda@cisbaf.org.br}

certificado.email.intervalo-segundos=${MAIL_INTERVALO_SEGUNDOS:15}
certificado.email.limite-24h=${MAIL_LIMITE_24H:400}
certificado.email.max-falhas-seguidas=${MAIL_MAX_FALHAS_SEGUIDAS:5}
